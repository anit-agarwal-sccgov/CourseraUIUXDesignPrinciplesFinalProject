<body>

    <script>
        const observer = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('is-visible'); });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    </script>
    <script src="animations.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
          var myGraph = document.getElementById('myGraph');
          var floydWarshall = new FusionCharts({
            type: 'treemaps',
            renderAt: 'myGraph',
            width: '100%',
            height: '400',
            dataFormat: 'json',
            dataSource: {
              "chart": {
                "caption": "Device Breakpoint Design Layouts",
                "subCaption": "Based on common device viewports",
                "theme": "fusion"
              },
              "row": [
                {
                  "id": "A",
                  "name": "Desktop ≥1025px",
                  "parent": "",
                  "value": 700,
                  "color": "#f8bbd0"
                },
                {
                  "id": "B",
                  "name": "3-col grid\nAsymmetric hero\nWide contact",
                  "parent": "A",
                  "value": 300,
                  "color": "#f8bbd0"
                },
                {
                  "id": "C",
                  "name": "Tablet ≤1024px",
                  "parent": "",
                  "value": 600,
                  "color": "#f9e79f"
                },
                {
                  "id": "D",
                  "name": "2-col grid\nEqual hero columns\nTighter spacing",
                  "parent": "C",
                  "value": 250,
                  "color": "#f9e79f"
                },
                {
                  "id": "E",
                  "name": "Mobile ≤768px",
                  "parent": "",
                  "value": 400,
                  "color": "#d1e8e2"
                },
                {
                  "id": "F",
                  "name": "1-col everything\nStacked hero\nHamburger nav\nFull-width buttons",
                  "parent": "E",
                  "value": 150,
                  "color": "#d1e8e2"
                }
              ]
            }
          });
          floydWarshall.render();
        });
      </script>
</body>
